<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgGrad)" rx="6"/>

  <!-- Top red accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="url(#redGrad)" rx="2"/>
  <!-- Bottom red accent bar -->
  <rect x="0" y="196" width="400" height="4" fill="url(#redGrad)" rx="2"/>

  <!-- Left vertical accent -->
  <rect x="0" y="4" width="4" height="192" fill="#c0392b" opacity="0.6"/>
  <!-- Right vertical accent -->
  <rect x="396" y="4" width="4" height="192" fill="#c0392b" opacity="0.6"/>

  <!-- Boxing glove icon left -->
  <g transform="translate(28, 72)" opacity="0.85">
    <ellipse cx="22" cy="30" rx="18" ry="22" fill="#c0392b"/>
    <rect x="8" y="38" width="28" height="12" rx="3" fill="#9b1a1a"/>
    <ellipse cx="22" cy="16" rx="14" ry="12" fill="#e74c3c"/>
    <ellipse cx="16" cy="12" rx="5" ry="8" fill="#c0392b" opacity="0.5"/>
    <line x1="8" y1="32" x2="36" y2="32" stroke="#9b1a1a" stroke-width="1.5"/>
  </g>

  <!-- Boxing glove icon right (mirrored) -->
  <g transform="translate(350, 72) scale(-1,1)" opacity="0.85">
    <ellipse cx="22" cy="30" rx="18" ry="22" fill="#c0392b"/>
    <rect x="8" y="38" width="28" height="12" rx="3" fill="#9b1a1a"/>
    <ellipse cx="22" cy="16" rx="14" ry="12" fill="#e74c3c"/>
    <ellipse cx="16" cy="12" rx="5" ry="8" fill="#c0392b" opacity="0.5"/>
    <line x1="8" y1="32" x2="36" y2="32" stroke="#9b1a1a" stroke-width="1.5"/>
  </g>

  <!-- BANG BROS main text -->
  <text
    x="200"
    y="98"
    font-family="Arial Black, Impact, sans-serif"
    font-size="54"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="4"
    filter="url(#glow)"
  >BANG BROS</text>

  <!-- Red underline divider -->
  <rect x="80" y="108" width="240" height="3" fill="url(#redGrad)" rx="1"/>

  <!-- MMA subtitle -->
  <text
    x="200"
    y="148"
    font-family="Arial Black, Impact, sans-serif"
    font-size="30"
    font-weight="900"
    fill="url(#redGrad)"
    text-anchor="middle"
    letter-spacing="14"
  >MMA</text>

  <!-- Tagline -->
  <text
    x="200"
    y="172"
    font-family="Arial, sans-serif"
    font-size="10"
    font-weight="400"
    fill="#777"
    text-anchor="middle"
    letter-spacing="4"
  >FIGHT · TRAIN · DOMINATE</text>
</svg>
